    #       data: 0
    #       note: >- 
    #         Thanks for your feedback! Help us improve this page by
    #         using our <a href="..." target="_blank" rel="noopener">feedback form</a>.
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our information and whether users
      find what they're searching for. With your consent, you're helping us to
      improve our site.

  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.braingenix.org/carboncopies/
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/groups/carboncopies/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/carboncopiesorg
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/8494124/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCuNZLgW-6Xcp6wfyb2Y_Thw
    - icon: fontawesome/brands/discord
      link: https://discord.gg/quqzV4P4Z4
    - icon: fontawesome/solid/paper-plane
      link: mailto:contact@carboncopies.org


extra_css:
  - stylesheets/extra.css


# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

