# Project information
site_name: Carboncopies Foundation
site_url: https://carboncopies.org/
# site_author: Martin Donath
# site_description: >-
  # Write your documentation in Markdown and create a professional static site in
  # minutes – searchable, customizable, in 60+ languages, for all devices

watch:
  - ./material

# Repository
repo_name: carboncopies
repo_url: https://gitlab.braingenix.org/carboncopies/
#color_mode_toggle: true
#color_mode: light

# Copyright
# copyright: Copyright &copy; 2016 - 2024 Martin Donath

# copyright: >
#   <a href="#__consent">Change cookie settings</a>

# Configuration
theme:
  name: material
  custom_dir: material/overrides
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    - navigation.expand
    - navigation.footer
    # - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    # - navigation.prune
    # - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        #icon: material/toggle-switch
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        #icon: material/toggle-switch-off
        icon: material/weather-sunny
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/Favicon.png
  # icon:
  #   logo: logo
  logo: assets/images/HeaderImage.png

# Plugins
plugins:
  - redirects:
      redirect_maps:
        # The mappings below redirect the year/month categories to their corresponding workshop pages.
        # See the nav tree structure.
        'Events/Workshops/Year-Month/2020-Dec.md' : 'Events/Workshops/Topic/UpdatingRoadmap/Part6/index.md'
        'Events/Workshops/Year-Month/2020-March.md' : 'Events/Workshops/Topic/UpdatingRoadmap/Part4/index.md'
        'Events/Workshops/Year-Month/2019-Dec.md' : 'Events/Workshops/Topic/UpdatingRoadmap/Part3/index.md'
        'Events/Workshops/Year-Month/2019-Sept.md' : 'Events/Workshops/Topic/UpdatingRoadmap/Part2/index.md'
        'Events/Workshops/Year-Month/2019-June.md' : 'Events/Workshops/Topic/UpdatingRoadmap/OxfordRoadmapReview/index.md'
        'Events/Workshops/Year-Month/2019-March.md' : 'Events/Workshops/Topic/AISafety/index.md'
        'Events/Workshops/Year-Month/2018-Sept.md' : 'Events/Workshops/Topic/MetaphysicsEthics/index.md'
        'Events/Workshops/Year-Month/2018-April.md' : 'Events/Workshops/Topic/BrainPreservationToReconstruction/index.md'
        'Events/Workshops/Year-Month/2018-Jan.md' : 'Events/Workshops/Topic/ReverseEngineering/index.md'

#   - blog
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
#   - minify:
#       minify_html: true

# Hooks
hooks:
  - material/overrides/hooks/shortcodes.py
  - material/overrides/hooks/translations.py

# Additional configuration
extra:
  status:
    new: Recently added
    deprecated: Deprecated
  analytics:
    provider: google
    property: G-GVN4RLJQMK
    # feedback:
    #   title: Was this page helpful?
    #   ratings:
    #     - icon: material/emoticon-happy-outline
    #       name: This page was helpful
    #       data: 1
    #       note: >-
    #         Thanks for your feedback!
